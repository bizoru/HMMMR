name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep pip-audit ruff

      - name: Ruff (style + bugbear)
        continue-on-error: true
        run: ruff check src TestData

      - name: Bandit (security)
        run: bandit -r src -ll -ii

      - name: Semgrep (security)
        env:
          SEMGREP_RULES: p/python p/security-audit p/command-injection p/bandit
        run: semgrep scan --config "$SEMGREP_RULES" --error --severity ERROR --severity WARNING .

      - name: pip-audit (dependencies)
        if: hashFiles('requirements.txt') != ''
        continue-on-error: true
        run: pip-audit -r requirements.txt --strict

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile check
        run: |
          python -m compileall -q src TestData
